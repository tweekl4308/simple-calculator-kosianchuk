name: CI/CD PipelineSS

on:
  push:
  pull_request:

jobs:

  # --- TEST ---
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test
        run: python -c "assert 1 == 1"

  # --- BUILD ---
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create artifact
        run: echo "build success" > artifact.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: file
          path: artifact.txt

  # --- STAGING ---
  deploy_staging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: file

      - name: Deploy to staging
        run: cat artifact.txt

  # --- VERIFY ---
  verify_staging:
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:
      - name: Verify
        run: python -c "assert 1 == 1"

  # --- PRODUCTION ---
  deploy_production:
    runs-on: ubuntu-latest
    needs: verify_staging
    environment:
      name: production
    steps:
      - name: Deploy
        run: echo "Deploy to production"
