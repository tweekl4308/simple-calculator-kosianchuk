name: CI/CD PipelineS

on:
  push:
  pull_request:

jobs:

  # Stage 1: Test
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit test
        run: python -c "assert 1 == 1"

  # Stage 2: Build
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create artifact
        run: echo "artifact build" > artifact.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-file
          path: artifact.txt

  # Stage 3: Deploy to Staging
  deploy_staging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-file

      - name: Deploy to staging
        run: cat artifact.txt

  # Stage 4: Verify Staging
  verify_staging:
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:
      - name: Smoke test
        run: python -c "assert 1 == 2"

  # Stage 5: Deploy to Production
  deploy_production:
    runs-on: ubuntu-latest
    needs: verify_staging
    environment:
      name: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-file

      - name: Deploy to production
        run: cat artifact.txt
